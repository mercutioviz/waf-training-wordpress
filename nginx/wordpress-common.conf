# Shared WordPress server config, included by both the :80 and :443 server blocks
# in nginx.conf. Keep protocol-specific directives (listen, ssl_*) out of here.

root /var/www/html;
index index.php index.html index.htm;

access_log /var/log/nginx/wordpress-access.log;
error_log /var/log/nginx/wordpress-error.log;

location / {
    try_files $uri $uri/ /index.php?$args;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass wordpress:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;

    # WordPress decides between http:// and https:// URLs by reading
    # $_SERVER['HTTPS'] (see the WP_HOME block setup.sh writes into wp-config.php).
    # These two params must come after `include fastcgi_params` to override it.
    fastcgi_param HTTPS $fastcgi_https if_not_empty;
    fastcgi_param REQUEST_SCHEME $client_scheme;

    fastcgi_buffering off;
}

location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires max;
    log_not_found off;
    access_log off;
}

location = /favicon.ico {
    log_not_found off;
    access_log off;
}

location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
}

location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

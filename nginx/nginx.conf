user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# nginx scrubs its environment before forking workers. Without this the
# LD_PRELOAD TLS key-logging shim loads but never sees $SSLKEYLOGFILE, and the
# keylog file silently stays empty. Harmless when key logging is disabled:
# the variable is simply unset. Must stay at top level - inside http{} it is a
# config error. See nginx/sslkeylog.c and setup-keylog.sh.
env SSLKEYLOGFILE;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 64M;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # The protocol the *client* actually used. When a TLS-terminating WAF sits in
    # front of this proxy it tells us via X-Forwarded-Proto; otherwise fall back to
    # the scheme nginx itself served. Keeps WordPress link generation correct in
    # both the standalone and behind-a-WAF deployments.
    map $http_x_forwarded_proto $client_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    # Translated into the CGI-style flag PHP exposes as $_SERVER['HTTPS'].
    # Empty for plain http, which `if_not_empty` turns into "don't send the param".
    map $client_scheme $fastcgi_https {
        default '';
        https   on;
    }

    # Plain HTTP. Deliberately still serves the site rather than redirecting to
    # HTTPS: WAF training wants the same request replayable over both schemes so
    # analysts can compare what the WAF sees.
    server {
        listen 80;
        server_name techgear.local localhost;

        include /etc/nginx/wordpress-common.conf;
    }

    # HTTPS with a self-signed certificate (see generate-certs.sh).
    server {
        listen 443 ssl;
        http2 on;
        server_name techgear.local localhost;

        ssl_certificate     /etc/nginx/certs/techgear.local.crt;
        ssl_certificate_key /etc/nginx/certs/techgear.local.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/wordpress-common.conf;
    }
}
